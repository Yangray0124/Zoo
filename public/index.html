<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動物園</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <div id="toast" class="toast hidden">訊息提示</div>

        <div id="login-screen" class="screen">
            <div class="login-box">
                <h1>🦁 動物園</h1>
                <p class="subtitle">強者生存，弱者智慧</p>
                <div class="input-group">
                    <input type="text" id="username" placeholder="帳號 (識別用)" style="border: 2px solid #3498db;">
                </div>
                <div class="input-group">
                    <input type="text" id="nickname" placeholder="暱稱 (顯示用)">
                </div>
                <div class="input-group">
                    <input type="text" id="room-id" placeholder="房間代碼">
                </div>
                <button class="btn-primary" onclick="joinRoom()">加入</button>

                <div class="room-list-container">
                    <h3>🏠 進行中的房間</h3>
                    <div id="room-list" class="room-list">
                        <div class="empty-room-msg">目前沒有房間</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="lobby-screen" class="screen hidden">
            <div class="lobby-layout">
                <div class="lobby-box">
                    <h2>等待大廳 <span id="display-room-id"></span></h2>
                    <div id="player-list" class="player-list"></div>
                    
                    <div class="lobby-controls-container">
                        
                        <div class="lobby-row-actions">
                            <button id="ready-btn" class="btn-secondary btn-action" onclick="toggleReady()">準備</button>
                            <button id="start-btn" class="btn-primary btn-action hidden" onclick="startGame()">開始遊戲</button>
                        </div>

                        <button id="leave-lobby-btn" class="btn-red btn-wide" onclick="leaveRoom()">🚪 離開房間</button>
                    </div>
                </div>

                <div id="deck-settings" class="settings-box hidden">
                    <h3>🛠️ 牌堆數量設定</h3>
                    <div id="settings-grid" class="settings-grid"></div>
                </div>
            </div>
        </div>

        <div id="game-screen" class="screen hidden">
            <div style="position: absolute; top: 10px; right: 10px; z-index: 100;">
                <button class="btn-red" onclick="leaveRoom()" style="padding: 5px 15px; font-size: 0.8em; border-radius: 5px; width: auto; margin: 0;">🚪 離開</button>
            </div>

            <div id="opponents-area" class="opponents-bar"></div>
            
            <div id="game-over-overlay" class="game-over-overlay hidden">
                <div class="result-box">
                    <h2>🏆 遊戲結束</h2>
                    <div id="result-list" class="result-list"></div>
                    <button id="back-lobby-btn" class="btn-primary hidden" onclick="resetGame()">回到大廳 (房主)</button>
                    <p id="waiting-host-msg" class="hidden">等待房主重置...</p>
                </div>
            </div>

            <div class="battle-ground">
                <div class="status-indicator" id="status-bar"></div>
                <div id="room-info">
                    <div id="discard-pile" class="hidden">
                        <div class="pile-label">🗑️ 棄牌區</div>
                        <div class="pile-cards"></div>
                    </div>
                </div>
                <div class="table-zone">
                    <div id="table-cards" class="card-row"></div>
                    <div id="table-info" class="table-info"></div>
                </div>
            </div>
            <div class="player-zone">
                <div class="controls">
                    <button onclick="playCards()" id="btn-play" class="btn-action play" disabled>出牌</button>
                    <button onclick="passTurn()" id="btn-pass" class="btn-action pass" disabled>PASS</button>
                </div>
                <div id="my-hand" class="card-row hand-cards"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
